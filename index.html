<!-- Favicon: switches automatically with OS light/dark mode -->
<link id="favicon-light" rel="icon" type="image/svg+xml" href="/favicon.svg" media="(prefers-color-scheme: light)">
<link id="favicon-dark"  rel="icon" type="image/svg+xml" href="/dark-favicon.svg" media="(prefers-color-scheme: dark)">
<script>
  (function () {
    var LIGHT = '/favicon.svg';
    var DARK  = '/dark-favicon.svg';
    /* Some browsers (Firefox, older Safari) ignore media="" on <link rel="icon">.
       This listener keeps a canonical un-mediaqued href in sync as a fallback. */
    function syncFavicon(prefersDark) {
      var el = document.getElementById('favicon-light') || document.querySelector('link[rel="icon"]');
      if (el) el.setAttribute('href', prefersDark ? DARK : LIGHT);
    }
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    syncFavicon(mq.matches);
    mq.addEventListener('change', function (e) { syncFavicon(e.matches); });
  })();
</script>
